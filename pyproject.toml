[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echopersona"
version = "0.1.0"
description = "Consent-centered local expressive TTS demonstration"
requires-python = ">=3.11,<3.13"
dependencies = [
 "streamlit==1.51.0", "numpy>=1.26,<3", "soundfile>=0.12.1,<0.14",
 "scipy>=1.12,<2", "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
live = ["chatterbox-tts==0.1.7"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
